name: Daily ENSO build

# Runs every day at 08:00 UTC and on every push to main.
# NOAA CPC typically updates monthly data within the first days of each month.
on:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: [main]
  workflow_dispatch:           # allow manual trigger from GitHub Actions UI

permissions:
  contents: write              # needed to commit enso.json back to the repo

jobs:
  build:
    name: Fetch ENSO data and update site/data/enso.json
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── Python ───────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── Dependencies (data layer only — no Streamlit/Plotly) ─────────────
      - name: Install data dependencies
        run: pip install -r requirements-data.txt

      # ── Run pipeline ──────────────────────────────────────────────────────
      # The correlations Parquet (data/processed/correlations.parquet) is
      # committed to the repo and read by build.py directly.
      # CHIRPS re-computation only runs via compute_correlations.py when needed.
      - name: Run build.py
        run: python build.py

      # ── Validate JSON output ──────────────────────────────────────────────
      - name: Validate enso.json structure
        run: |
          python - <<'EOF'
          import json, sys
          from datetime import datetime, timezone

          with open('site/data/enso.json') as f:
              d = json.load(f)

          required = ['current', 'oni_series', 'correlations', 'episodes',
                      'seasonal_correlations', 'frequency_stats',
                      'frequency_methodology', 'iri_forecast', 'last_updated']
          missing = [k for k in required if k not in d]
          if missing:
              print(f'FAIL: missing keys: {missing}', file=sys.stderr)
              sys.exit(1)

          # --- Core indicators: hard fail if any is wrong ---
          c = d['current']
          assert isinstance(c['oni_value'], float), 'oni_value must be float'
          assert c['phase'] in ('El Niño', 'La Niña', 'Neutral'), 'invalid phase'
          assert len(d['oni_series']) > 100, 'oni_series too short'
          assert len(d['correlations']) > 0, 'no correlation rows'

          # --- Niño 3.4 freshness check ---
          # When ERDDAP is down, CPC fallback has the same latency as ONI.
          # Warn but don't block the build — build.py already validated this.
          from datetime import date as _date
          oni_d = _date.fromisoformat(c['oni_date'])
          n34_d = _date.fromisoformat(c['nino34_date'])
          if n34_d <= oni_d:
              print(f'::warning::Niño 3.4 date ({n34_d}) is NOT more recent than ONI date ({oni_d}). '
                    f'ERDDAP likely down — using CPC fallback (degraded freshness).')
          else:
              print(f'OK: Niño 3.4 date ({n34_d}) > ONI date ({oni_d})')

          # --- Freshness test: each indicator declares expected latency ---
          from datetime import timedelta
          today = _date.today()
          freshness = {
              'ONI': (oni_d, 90, 'oni_date'),     # ~2 months + buffer
              'Niño 3.4': (n34_d, 45, 'nino34_date'),  # ~1 week + buffer
              'SOI': (_date.fromisoformat(c['soi_date']), 60, 'soi_date'),  # ~1 month + buffer
          }
          for name, (ind_date, max_days, field) in freshness.items():
              age = (today - ind_date).days
              if age > max_days:
                  print(f'::warning::{name} is {age} days old (limit: {max_days}d). Date: {ind_date}.')
              else:
                  print(f'OK: {name} freshness: {age}d old (limit: {max_days}d)')

          sc = d['seasonal_correlations']
          assert all(k in sc for k in ['SON','DEF','MAM','JJA']), 'missing seasonal keys'
          fs = d['frequency_stats']
          assert all(k in fs for k in ['SON','DEF','MAM','JJA']), 'missing frequency_stats seasons'
          fm = d['frequency_methodology']
          assert 'families' in fm, 'frequency_methodology missing families'

          # --- IRI forecast: warn but allow stale cache up to 45 days ---
          iri = d['iri_forecast']
          iri_status = 'missing'
          if iri is not None:
              stale_since = iri.get('stale_since')
              if stale_since:
                  age_days = (datetime.now(timezone.utc) - datetime.fromisoformat(stale_since)).days
                  if age_days > 45:
                      print(f'FAIL: cached IRI forecast is {age_days} days stale (limit: 45)', file=sys.stderr)
                      sys.exit(1)
                  iri_status = f'stale ({age_days}d, from {iri["year"]}/{iri["month"]})'
                  print(f'::warning::IRI forecast is stale ({age_days}d). Using cached data from {iri["year"]}/{iri["month"]}.')
              else:
                  iri_status = 'fresh' if iri.get('probabilities') else 'urls-only'
          else:
              print('FAIL: iri_forecast is None and no cached version available', file=sys.stderr)
              sys.exit(1)

          # --- Cross-check: correlation vs frequency verdicts ---
          # When one method says significant and the other does not, warn.
          # This happened with Patagonia SON (r=+0.18* but 9/14 p=0.42).
          discrepancies = []
          for sn in ['SON','DEF','MAM','JJA']:
              s_corrs = sc.get(sn, [])
              s_freq = fs.get(sn, {})
              for corr_rec in s_corrs:
                  reg = corr_rec['region']
                  corr_sig = corr_rec['pearson_p'] < 0.05
                  for pk in ['el_nino', 'la_nina']:
                      freq_cell = (s_freq.get(reg) or {}).get(pk)
                      if not freq_cell:
                          continue
                      freq_sig = freq_cell.get('significant', False)
                      if corr_sig != freq_sig and corr_rec['lag'] == 0:
                          direction = 'corr=sig freq=ns' if corr_sig else 'corr=ns freq=sig'
                          discrepancies.append(f'{sn} {reg} {pk}: {direction} '
                              f'(r={corr_rec["pearson_r"]}, p_corr={corr_rec["pearson_p"]}, '
                              f'M/N={freq_cell["M_above_median"]}/{freq_cell["N"]}, p_freq={freq_cell["p_binomial"]})')
          if discrepancies:
              for disc in discrepancies:
                  print(f'::warning::Method discrepancy: {disc}')
              print(f'WARN: {len(discrepancies)} correlation vs frequency discrepancies (see above)')

          print(f"OK: phase={c['phase']}, ONI={c['oni_value']}, "
                f"{len(d['oni_series'])} ONI points, "
                f"{len(d['correlations'])} correlation rows, "
                f"{len(d['episodes'])} episodes, "
                f"seasonal={list(sc.keys())}, "
                f"IRI={iri_status}")
          EOF

      # ── Commit and push if changed ────────────────────────────────────────
      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/enso.json site/data/sst_map.json
          # Only commit if files actually changed
          if git diff --cached --quiet; then
            echo "No changes in data files — nothing to commit."
          else
            git commit -m "data: daily ENSO update $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
