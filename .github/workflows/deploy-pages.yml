name: Deploy to GitHub Pages

# Fires on every push to main, after daily-build completes (bot pushes
# don't trigger the push event), and on manual dispatch.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Daily ENSO build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload site/ and deploy
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Smoke-lint inline JS
        run: |
          npm i --no-save eslint
          node tests/smoke-lint.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
