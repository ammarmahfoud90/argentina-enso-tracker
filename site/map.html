<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa ENSO Argentina</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Libre+Franklin:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #FFFFFF; overflow: hidden; }
  </style>
</head>
<body>
<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
/* ======================================================================
   Argentina ENSO signal map — v2
   Circles sized r = 9 + |pearson_r| × 90, oklch fill, dashed when p ≥ 0.05.
   All correlation values loaded from data/enso.json — no hardcoded data.
   ====================================================================== */

const SIG_THRESHOLD = 0.05;

function col(r, sig) {
  if (!sig) return 'rgba(167,174,187,0.35)';
  const a = Math.min(1, Math.abs(r) / 0.25);
  const C = (r >= 0 ? 0.14 : 0.12) * a;
  const H = r >= 0 ? 30 : 262;
  const A = (0.25 + 0.6 * a).toFixed(2);
  return `oklch(0.56 ${C.toFixed(3)} ${H} / ${A})`;
}

(async () => {
  /* 1. Load ENSO data */
  let data;
  try {
    const resp = await fetch('data/enso.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    data = await resp.json();
  } catch (err) {
    document.getElementById('map').textContent = 'Error: ' + err.message;
    return;
  }

  /* 2. Build best-corr per region */
  const bestByRegion = {};
  const regionOrder = data.region_order || Object.keys(data.region_meta || {});
  for (const region of regionOrder) {
    const rows = (data.correlations || []).filter(c => c.region === region);
    const sig = rows.filter(c => c.pearson_p < SIG_THRESHOLD);
    const pool = sig.length ? sig : rows;
    if (!pool.length) { bestByRegion[region] = null; continue; }
    bestByRegion[region] = pool.reduce((a, b) => Math.abs(a.pearson_r) >= Math.abs(b.pearson_r) ? a : b);
  }

  /* 3. Region centroids from region_meta */
  const REGION_LL = {};
  for (const [name, meta] of Object.entries(data.region_meta || {})) {
    REGION_LL[name] = [meta.center_lon, meta.center_lat];
  }

  /* 4. Map */
  const topo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')).json();
  const countries = topojson.feature(topo, topo.objects.countries);
  const arg = countries.features.find(f => f.id === '032');
  const neighbors = countries.features.filter(f => ['068','076','152','600','858','604'].includes(f.id));

  const W = 720, H = 560;
  const proj = d3.geoMercator().fitExtent([[20, 18], [430, H - 18]], arg);
  const path = d3.geoPath(proj);

  const svg = d3.select('#map').append('svg')
    .attr('viewBox', `0 0 ${W} ${H}`)
    .style('width', '100%').style('height', 'auto').style('display', 'block');

  /* Neighbors */
  svg.selectAll('.nb').data(neighbors).join('path')
    .attr('d', path).attr('fill', '#F0F2F5').attr('stroke', '#DEE2E8').attr('stroke-width', 0.8);

  /* Argentina */
  svg.append('path').datum(arg)
    .attr('d', path).attr('fill', '#FAFBFC').attr('stroke', '#14161A').attr('stroke-width', 1.1);

  /* Islas Malvinas override label */
  const [mlx, mly] = proj([-59.0, -51.8]);
  if (mlx && mly) {
    svg.append('text')
      .attr('x', mlx).attr('y', mly)
      .attr('text-anchor', 'middle')
      .attr('font-family', 'IBM Plex Mono, monospace')
      .attr('font-size', '8px')
      .attr('fill', '#79818E')
      .text('Islas Malvinas (Arg.)');
  }

  /* Region circles */
  const regData = regionOrder.map(n => ({
    n,
    ll: REGION_LL[n],
    best: bestByRegion[n],
  })).filter(d => d.ll);

  const rad = r => 9 + Math.abs(r) * 90;

  const g = svg.selectAll('.reg').data(regData).join('g')
    .attr('transform', d => { const p = proj(d.ll); return `translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`; });

  g.append('circle')
    .attr('r', 0)
    .attr('fill', d => d.best ? col(d.best.pearson_r, d.best.pearson_p < SIG_THRESHOLD) : col(0, false))
    .attr('stroke', '#14161A')
    .attr('stroke-width', d => (d.best && d.best.pearson_p < SIG_THRESHOLD) ? 1.2 : 0.6)
    .attr('stroke-dasharray', d => (d.best && d.best.pearson_p < SIG_THRESHOLD) ? null : '2 3')
    .transition().duration(650)
    .delay((d, i) => 350 + i * 130)
    .ease(d3.easeCubicOut)
    .attr('r', d => d.best ? rad(d.best.pearson_r) : rad(0.03));

  g.append('text')
    .attr('x', d => d.best ? rad(d.best.pearson_r) + 8 : rad(0.03) + 8)
    .attr('y', -2)
    .attr('font-family', 'Libre Franklin, sans-serif')
    .attr('font-size', 13)
    .attr('font-weight', 700)
    .attr('fill', '#14161A')
    .text(d => d.n);

  g.append('text')
    .attr('x', d => d.best ? rad(d.best.pearson_r) + 8 : rad(0.03) + 8)
    .attr('y', 14)
    .attr('font-family', 'IBM Plex Mono, monospace')
    .attr('font-size', 11.5)
    .attr('fill', '#555C68')
    .text(d => {
      if (!d.best) return 'sin datos';
      const r = d.best.pearson_r;
      const sign = r >= 0 ? '+' : '−';
      const stars = d.best.pearson_stars || '';
      const ns = (d.best.pearson_p >= SIG_THRESHOLD) ? ' n.s.' : '';
      return sign + Math.abs(r).toFixed(3) + stars + ns;
    });

  /* Legend */
  const lg = svg.append('g').attr('transform', `translate(${W - 235}, ${H - 208})`);
  lg.append('text')
    .attr('font-family', 'IBM Plex Mono, monospace')
    .attr('font-size', 10.5)
    .attr('letter-spacing', '0.1em')
    .attr('fill', '#79818E')
    .text('SEÑAL ENSO → LLUVIA');

  const legendItems = [[0.35, '***', true, 'Sig. fuerte (|r|≥0.35)'], [0.22, '**', true, 'Sig. moderada (|r|≥0.20)'], [0.10, '*', true, 'Sig. débil (|r|<0.20)'], [0.02, '', false, 'No significativa']];
  legendItems.forEach(([r, stars, sig, label], i) => {
    const y = 24 + i * 40;
    lg.append('circle')
      .attr('cx', 12).attr('cy', y)
      .attr('r', rad(r) * 0.55)
      .attr('fill', col(r, sig))
      .attr('stroke', '#14161A')
      .attr('stroke-width', sig ? 1 : 0.6)
      .attr('stroke-dasharray', sig ? null : '2 3');
    lg.append('text')
      .attr('x', 34).attr('y', y + 4)
      .attr('font-family', 'IBM Plex Mono, monospace')
      .attr('font-size', 11.5)
      .attr('fill', '#555C68')
      .text(label);
  });

  lg.append('text')
    .attr('y', 198)
    .attr('font-family', 'IBM Plex Mono, monospace')
    .attr('font-size', 10)
    .attr('fill', '#A7AEBB')
    .text('Geometría: Natural Earth');
})();
</script>
</body>
</html>
