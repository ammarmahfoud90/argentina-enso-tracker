services:
  # ── Static site (primary) ─────────────────────────────────────────────
  # Serves site/ as a static site. No build command needed — enso.json
  # is committed to the repo and updated daily by the GitHub Action.
  #
  # Manual Render dashboard steps (if render.yaml auto-deploy doesn't apply):
  #   1. Go to your Render service → Settings → Build & Deploy
  #   2. Set "Publish directory" to: site
  #   3. Remove the old start command (no server process needed)
  #   4. Set "Environment" to: Static Site
  #
  - type: web
    name: argentina-enso-tracker
    runtime: static
    staticPublishPath: site
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600, stale-while-revalidate=86400
      - path: /data/enso.json
        name: Cache-Control
        value: public, max-age=1800, stale-while-revalidate=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Legacy Streamlit app (kept for reference; NOT deployed) ───────────
