services:
  - type: web
    name: argentina-enso-tracker
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: CONTACT_EMAIL
        sync: false        # set in Render dashboard
      - key: GITHUB_REPO_URL
        sync: false        # set in Render dashboard
    autoDeploy: true
